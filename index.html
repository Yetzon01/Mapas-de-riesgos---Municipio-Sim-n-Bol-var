<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Ecosocialista - Simón Bolívar</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <style>
        :root {
            --v-lime: #ccff00; /* Verde brillante para visibilidad */
            --v-deep: #1b4d3e; /* Verde profundo institucional */
            --v-yellow: #ffde59; /* Amarillo para acentos */
            --bg-dark: #121212;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Panel Lateral de Registro */
        .registration-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 320px;
            max-height: 90vh;
            background: rgba(27, 77, 62, 0.95);
            z-index: 1000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow-y: auto;
            border: 2px solid var(--v-lime);
        }

        h2 { color: var(--v-lime); margin-top: 0; font-size: 1.2rem; }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }

        button {
            background-color: var(--v-lime);
            color: var(--v-deep);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        /* Estilo para el punto azul de ubicación */
        .user-location-dot {
            background-color: #2196F3;
            border: 2px solid white;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            box-shadow: 0 0 10px #2196F3;
        }
    </style>
</head>
<body>

<div class="registration-panel" id="regPanel">
    <h2>Registro de Vocería</h2>
    <form id="ecoForm">
        <input type="text" id="nombre" placeholder="Nombre Completo" required>
        <input type="email" id="email" placeholder="Correo Electrónico" required>
        <select id="comuna" required>
            <option value="">Seleccione Comuna</option>
            <option value="Bolivar">Simón Bolívar</option>
            <option value="Mesones">Mesones</option>
            <option value="Naricual">Naricual</option>
        </select>
        <input type="hidden" id="geo_data">
        <button type="submit" id="btnGuardar">Guardar en Sistema</button>
    </form>
    <p id="statusMsg" style="font-size: 0.8rem; margin-top: 10px;"></p>
</div>

<div id="map"></div>

<!-- Scripts Externos -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Configuración de Supabase
    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Inicialización del Mapa (Centrado en Barcelona, Anzoátegui)
    const map = L.map('map').setView([10.1333, -64.7000], 13);
    
    const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains:['mt0','mt1','mt2','mt3']
    }).addTo(map);

    // 3. Persistencia con Local Storage
    const form = document.getElementById('ecoForm');
    
    // Auto-guardado en LocalStorage mientras el usuario escribe
    form.addEventListener('input', () => {
        const tempData = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            comuna: document.getElementById('comuna').value
        };
        localStorage.setItem('temp_registro', JSON.stringify(tempData));
    });

    // Recuperar datos al recargar
    window.onload = () => {
        const saved = localStorage.getItem('temp_registro');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('nombre').value = data.nombre || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('comuna').value = data.comuna || '';
        }
    };

    // 4. Herramientas de Dibujo (Polígonos de Riesgo)
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
        draw: {
            polygon: true,
            polyline: true,
            circle: false,
            marker: true,
            rectangle: false
        },
        edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (event) {
        const layer = event.layer;
        drawnItems.addLayer(layer);
        document.getElementById('geo_data').value = JSON.stringify(layer.toGeoJSON());
    });

    // 5. Envío de Datos a Supabase
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        const msg = document.getElementById('statusMsg');
        
        btn.disabled = true;
        msg.innerText = "Sincronizando con Supabase...";

        const payload = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            comuna: document.getElementById('comuna').value,
            geometria: document.getElementById('geo_data').value,
            fecha_registro: new Date().toISOString()
        };

        const { data, error } = await supabase
            .from('registross_voceros')
            .insert([payload]);

        if (error) {
            msg.style.color = "red";
            msg.innerText = "Error: " + error.message;
            console.error(error);
        } else {
            msg.style.color = var(--v-lime);
            msg.innerText = "¡Registro exitoso en Barcelona!";
            localStorage.removeItem('temp_registro'); // Limpiar al éxito
            form.reset();
            drawnItems.clearLayers();
        }
        btn.disabled = false;
    });

    // 6. Geolocalización en Tiempo Real
    map.locate({setView: true, maxZoom: 16, watch: true});
    
    let locationMarker;
    map.on('locationfound', (e) => {
        const radius = e.accuracy / 2;
        if (!locationMarker) {
            locationMarker = L.marker(e.latlng, {
                icon: L.divIcon({className: 'user-location-dot'})
            }).addTo(map);
        } else {
            locationMarker.setLatLng(e.latlng);
        }
    });
</script>

</body>
</html>
