<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIG Ecosocial - Municipio Simón Bolívar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ... TU CSS ORIGINAL SE MANTIENE TOTALMENTE IGUAL ... */
        :root { 
            --v-lime: #B4D445; --v-deep: #135242; --negro-card: rgba(20, 22, 21, 0.98);
            --v-osc: #135242; --v-lim: #B4D445; --negro: #1a1c1b;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }

        /* Estilos de ocultación inicial */
        #sistema-principal { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #111; color: white; }
        
        /* ... RESTO DE TU CSS ORIGINAL ... */
        #pantalla-registro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--v-lime) 0%, var(--v-deep) 100%); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .card-registro { background: var(--negro-card); border: 2px solid var(--v-lime); width: 650px; padding: 40px; border-radius: 25px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); text-align: center; }
        #video-contenedor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 6000; display: none; align-items: center; justify-content: center; }
        /* (El resto de tus estilos aquí...) */
    </style>
</head>
<body>

<div id="pantalla-registro">
    <div class="card-registro">
        <h2>SISTEMA DE GESTIÓN</h2>
        <div class="tabs-acceso">
            <button class="tab-btn active" onclick="cambiarSeccion('registro')">Registro Vocero</button>
            <button class="tab-btn" onclick="cambiarSeccion('admin')">Administrador</button>
        </div>
        </div>
</div>

<div id="video-contenedor">
    <video id="animacion-video" muted>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<div id="sistema-principal">
    <div id="header">
        </div>
    <div id="contenedor">
        </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://npmcdn.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ... TODA TU LÓGICA JS ORIGINAL ...
    // La función 'reproducirAnimacion' ya conecta el login con el dashboard
    function reproducirAnimacion(rol) {
        const videoContenedor = document.getElementById('video-contenedor');
        const video = document.getElementById('animacion-video');
        videoContenedor.style.display = 'flex'; 
        video.play();
        video.onended = async function() {
            // AQUÍ ES DONDE SE OCULTA EL LOGIN Y SE MUESTRA TU MAPA
            videoContenedor.style.display = 'none'; 
            document.getElementById('pantalla-registro').style.display = 'none'; 
            document.getElementById('sistema-principal').style.display = 'flex';
            
            // ... resto de tu lógica de carga ...
            inicializarMapa();
            // ...
        };
    }
</script>
</body>
</html>
