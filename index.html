<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro REDVIDA / SIGP</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --danger-color: #ff4d4d;
            --dark-bg: #1e1e24;
            --card-bg: #2a2a35;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #bbb;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #15151a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .list-container {
            margin-top: 25px;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-list li {
            background: #22222b;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #00c6ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item-list li:hover {
            background: #2d2d3a;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            display: none; /* Se muestra cuando el usuario interactúa */
        }

        /* Clase activa para cuando se selecciona el elemento */
        .item-list li.selected .delete-btn {
            display: block;
        }

        .item-info {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Datos Ambientales</h2>
        
        <!-- Formulario con los campos avanzados -->
        <form id="dataForm">
            <div class="form-group">
                <label for="comuna">Comuna / Ámbito Territorial</label>
                <input type="text" id="comuna" placeholder="Ej. Comuna 1" required>
            </div>
            
            <div class="form-group">
                <label for="coordenadas">Coordenadas GPS</label>
                <input type="text" id="coordenadas" placeholder="Ej. 10.136, -64.686" required>
            </div>

            <div class="form-group">
                <label for="nudoCritico">Nudo Crítico / Problema Detectado</label>
                <select id="nudoCritico">
                    <option value="Acumulación de Basura">Acumulación de Basura</option>
                    <option value="Deforestación / Tala">Deforestación / Tala</option>
                    <option value="Riesgo de Inundación">Riesgo de Inundación</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <button type="submit">Guardar Registro</button>
        </form>

        <!-- Sección de Visualización y Gestión -->
        <div class="list-container">
            <h3>Registros Guardados (Haz clic para seleccionar y eliminar)</h3>
            <ul id="recordsList" class="item-list">
                <!-- Los elementos cargados se mostrarán aquí -->
            </ul>
        </div>
    </div>

    <script>
        const dataForm = document.getElementById('dataForm');
        const recordsList = document.getElementById('recordsList');

        // Estructura de datos para almacenar temporalmente los registros
        let registros = [];

        // Función para renderizar la lista en pantalla
        function renderList() {
            recordsList.innerHTML = '';
            
            if (registros.length === 0) {
                recordsList.innerHTML = '<li style="border-left: 4px solid #555; color: #888;">No hay registros activos.</li>';
                return;
            }

            registros.forEach((reg, index) => {
                const li = document.createElement('li');
                
                // Contenedor de información del registro
                const infoDiv = document.createElement('div');
                infoDiv.className = 'item-info';
                infoDiv.innerHTML = `<strong>${reg.comuna}</strong> - ${reg.nudoCritico}<br><small style="color: #00c6ff;">${reg.coordenadas}</small>`;
                
                // Botón de eliminación (aparece al seleccionar el elemento)
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerText = 'Eliminar';
                
                // Evento para eliminar el registro específico
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita conflictos con el clic del contenedor
                    eliminarRegistro(index);
                });

                li.appendChild(infoDiv);
                li.appendChild(deleteBtn);

                // Evento de selección: Al hacer clic, alterna la opción de eliminarlo
                li.addEventListener('click', () => {
                    // Deselecciona cualquier otro que esté abierto
                    document.querySelectorAll('.item-list li').forEach(el => {
                        if (el !== li) el.classList.remove('selected');
                    });
                    // Activa/desactiva el actual
                    li.classList.toggle('selected');
                });

                recordsList.appendChild(li);
            });
        }

        // Función para agregar un nuevo registro sin alterar la lógica previa
        dataForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const nuevoRegistro = {
                comuna: document.getElementById('comuna').value,
                coordenadas: document.getElementById('coordenadas').value,
                nudoCritico: document.getElementById('nudoCritico').value
            };

            registros.push(nuevoRegistro);
            dataForm.reset();
            renderList();
        });

        // Función para remover el registro del arreglo
        function eliminarRegistro(index) {
            registros.splice(index, 1);
            renderList();
        }

        // Inicializar la vista
        renderList();
    </script>
</body>
</html>
