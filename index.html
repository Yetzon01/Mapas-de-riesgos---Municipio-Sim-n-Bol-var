<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIG Ecosocial - Municipio Simón Bolívar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --v-lime: #B4D445; --v-deep: #135242; --negro-card: rgba(20, 22, 21, 0.98); --v-osc: #135242; --v-lim: #B4D445; --negro: #1a1c1b; }
        body, html { margin: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }
        #pantalla-registro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--v-lime) 0%, var(--v-deep) 100%); z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .card-registro { background: var(--negro-card); border: 2px solid var(--v-lime); width: 90%; max-width: 600px; padding: 30px; border-radius: 25px; text-align: center; color: white; }
        #sistema-principal { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #111; color: white; }
        #header { height: 100px; background: var(--v-osc); border-bottom: 5px solid var(--v-lim); display: flex; align-items: center; justify-content: center; position: relative; }
        #contenedor { display: flex; flex-grow: 1; overflow: hidden; }
        #sidebar { width: 380px; background: var(--negro); padding: 15px; overflow-y: auto; border-right: 2px solid #333; }
        #map { flex-grow: 1; background: #1a1a1a; z-index: 1; }
        .btn-acceder { background: var(--v-lime); color: var(--v-deep); border: none; padding: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn-mapa { width: 100%; padding: 10px; margin: 4px 0; background: #252827; color: white; border: 1px solid #444; border-radius: 6px; cursor: pointer; text-align: left; font-size: 12px; }
        .btn-mapa.active { background: var(--v-osc) !important; border-color: var(--v-lim); }
        .controles-mapa { position: absolute; top: 120px; left: 400px; z-index: 1000; display: flex; gap: 10px; }
        .btn-float { width: 45px; height: 45px; background: white; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        input, select { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 8px; margin: 5px 0; border-radius: 5px; }
        .map-icon-container { background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 2px solid var(--v-osc); }
    </style>
</head>
<body>

<div id="pantalla-registro">
    <div class="card-registro">
        <h2>SISTEMA DE GESTIÓN</h2>
        <p style="color: var(--v-lime)">Municipio Simón Bolívar</p>
        <input type="email" id="userEmail" placeholder="Correo electrónico del vocero">
        <button class="btn-acceder" onclick="ingresarSistema()">INGRESAR AL MAPA</button>
    </div>
</div>

<div id="sistema-principal">
    <div id="header">
        <div style="text-align: center;">
            <div style="font-weight: 900; font-size: 20px;">MAPA DE RIESGOS COMUNITARIOS</div>
            <div style="font-size: 12px; color: var(--v-lime);">Barcelona, Anzoátegui</div>
        </div>
    </div>
    <div id="contenedor">
        <div id="sidebar">
            <h4 style="color: var(--v-lime)">📍 TERRITORIO</h4>
            <select id="selectComuna">
                <option value="">Seleccione Comuna...</option>
                <option value="MESONES">LOS MESONES UNIDOS CON CHAVEZ</option>
                <option value="CHAVEZ_ETERNO">4F-92 COMANDANTE ETERNO</option>
            </select>
            <input type="text" id="infoSector" placeholder="Nombre del Sector">
            
            <h4 style="color: var(--v-lime)">✍️ DELIMITACIÓN</h4>
            <button class="btn-mapa" onclick="iniciarTrazado('pol')">📐 TRAZAR POLÍGONO (SECTOR/RIESGO)</button>
            <button class="btn-mapa" onclick="iniciarTrazado('line')">〰️ TRAZAR CANAL / LÍNEA</button>
            
            <h4 style="color: var(--v-lime)">🚩 ICONOS</h4>
            <button class="btn-mapa" onclick="seleccionarEmoji('⚠️', 'riesgo')">⚠️ Zona de Riesgo</button>
            <button class="btn-mapa" onclick="seleccionarEmoji('🌊', 'inundacion')">🌊 Zona Inundable</button>
            <button class="btn-mapa" onclick="seleccionarEmoji('🏥', 'salud')">🏥 Centro de Salud</button>

            <button class="btn-acceder" style="background: #e74c3c; color: white;" onclick="guardarDatosNube()">💾 GUARDAR CAMBIOS Y SALIR</button>
        </div>
        <div class="controles-mapa">
            <button id="btnMano" class="btn-float" onclick="activarMano()">🖐️</button>
            <button id="btnFinalizar" class="btn-float" style="display:none; background: var(--v-lime);" onclick="finalizarTrazado()">✅</button>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://npmcdn.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = 'https://zezcmftcbbzplhtdqotd.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_bNaRcykfZaVdW67HsEf3Tw_rWemQCui'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var map, drawnItems = [], emojiActual = null;
    var userEmailActive = "";

    function ingresarSistema() {
        userEmailActive = document.getElementById('userEmail').value;
        if (!userEmailActive) return alert("Ingrese un correo");
        document.getElementById('pantalla-registro').style.display = 'none';
        document.getElementById('sistema-principal').style.display = 'flex';
        inicializarMapa();
        cargarDatosPrevios();
    }

    function inicializarMapa() {
        map = L.map('map', { editable: true }).setView([10.136, -64.686], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

        map.on('editable:drawing:end', function(e) {
            let desc = prompt("¿Qué representa este trazo? (Nombre del Sector o Tipo de Riesgo)");
            e.layer.bindPopup(desc || "Sin descripción").openPopup();
            e.layer.descripcion = desc;
            drawnItems.push(e.layer);
            activarMano();
        });

        map.on('click', function(e) {
            if (emojiActual) {
                let m = L.marker(e.latlng, {
                    icon: L.divIcon({ className: '', html: `<div class="map-icon-container">${emojiActual}</div>`, iconSize: [24, 24] })
                }).addTo(map);
                drawnItems.push(m);
            }
        });
    }

    function iniciarTrazado(tipo) {
        activarMano();
        document.getElementById('btnFinalizar').style.display = 'flex';
        if (tipo === 'pol') map.editTools.startPolygon();
        else map.editTools.startPolyline();
    }

    function finalizarTrazado() {
        map.editTools.stopDrawing();
        document.getElementById('btnFinalizar').style.display = 'none';
    }

    function activarMano() {
        emojiActual = null;
        document.getElementById('btnFinalizar').style.display = 'none';
    }

    function seleccionarEmoji(e, tipo) {
        emojiActual = e;
        alert("Haz clic en el mapa para colocar el icono: " + e);
    }

    async function guardarDatosNube() {
        const comuna = document.getElementById('selectComuna').value;
        const sector = document.getElementById('infoSector').value;
        
        if (!comuna) return alert("Selecciona una comuna antes de guardar");

        // Convertimos todos los elementos a un solo GeoJSON
        let coleccion = L.featureGroup(drawnItems).toGeoJSON();
        
        // CORRECCIÓN DEL ERROR DE CAPTURA: Usamos una lógica de inserción limpia
        const { error } = await _supabase.from('mapas_comunales').insert([{
            usuario_email: userEmailActive,
            id_comuna: comuna,
            nombre_sector: sector,
            geometria_mapa: coleccion
        }]);

        if (error) {
            console.error(error);
            alert("Error al guardar: " + error.message);
        } else {
            alert("✅ Mapa guardado exitosamente en la nube.");
            location.reload();
        }
    }

    async function cargarDatosPrevios() {
        const { data, error } = await _supabase
            .from('mapas_comunales')
            .select('*')
            .eq('usuario_email', userEmailActive)
            .order('created_at', { ascending: false })
            .limit(1);

        if (data && data[0]) {
            L.geoJSON(data[0].geometria_mapa, {
                onEachFeature: function(feature, layer) {
                    layer.addTo(map);
                    drawnItems.push(layer);
                }
            }).addTo(map);
            document.getElementById('selectComuna').value = data[0].id_comuna;
            document.getElementById('infoSector').value = data[0].nombre_sector;
        }
    }
</script>
</body>
</html>
