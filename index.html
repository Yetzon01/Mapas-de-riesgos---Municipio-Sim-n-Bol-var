<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG Ecosocial - Municipio Simón Bolívar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --v-lime: #B4D445; 
            --v-deep: #135242; 
            --negro-card: rgba(20, 22, 21, 0.98);
            --v-osc: #135242;
            --v-lim: #B4D445;
            --negro: #1a1c1b;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; overflow: hidden; }

        /* Pantalla de Registro con Gradiente Institucional */
        #pantalla-registro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--v-lime) 0%, var(--v-deep) 100%);
            z-index: 5000; display: flex; align-items: center; justify-content: center;
        }

        .card-registro {
            background: var(--negro-card); border: 2px solid var(--v-lime);
            width: 90%; max-width: 650px; padding: 40px; border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); text-align: center;
        }

        .logos-registro { display: flex; justify-content: space-between; margin-bottom: 20px; height: 80px; }
        .logo-wrapper { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .logos-registro img { max-width: 80%; max-height: 100%; object-fit: contain; }

        .tabs-acceso { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #666; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px; padding: 10px; transition: 0.3s; }
        .tab-btn.active { color: var(--v-lime); border-bottom: 2px solid var(--v-lime); }

        h2 { margin: 0; font-size: 22px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { color: var(--v-lime); font-size: 12px; margin-bottom: 30px; font-weight: bold; }

        /* Formularios */
        .form-registro, .form-admin { display: grid; gap: 15px; text-align: left; }
        .form-admin { display: none; }
        .form-row { display: flex; gap: 15px; }
        .form-group { flex: 1; }
        label { font-size: 10px; color: var(--v-lime); text-transform: uppercase; font-weight: 800; margin-bottom: 5px; display: block; }

        input, select { 
            width: 100%; background: #111; border: 1px solid #333; color: white; 
            padding: 12px; border-radius: 8px; outline: none; font-size: 14px; 
        }
        input:focus { border-color: var(--v-lime); }

        .btn-acceder {
            background: var(--v-lime); color: var(--v-deep); border: none;
            padding: 16px; border-radius: 10px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; width: 100%; margin-top: 10px;
        }

        /* Sistema Principal */
        #sistema-principal { display: none; width: 100vw; height: 100vh; flex-direction: column; }
        #header { height: 80px; background: var(--v-osc); border-bottom: 4px solid var(--v-lim); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        #contenedor { display: flex; flex-grow: 1; overflow: hidden; }
        
        #sidebar { width: 380px; background: var(--negro); color: white; padding: 15px; overflow-y: auto; border-right: 1px solid #333; }
        #map { flex-grow: 1; background: #1a1a1a; }

        .btn-mapa { 
            width: 100%; padding: 10px; margin: 4px 0; background: #252827; 
            color: white; border: 1px solid #444; border-radius: 6px; cursor: pointer;
            display: flex; justify-content: space-between; font-size: 12px;
        }
        .btn-mapa.active { border-color: var(--v-lime); background: var(--v-deep); }
        .count-badge { background: var(--v-lime); color: var(--v-deep); padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        #video-contenedor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 6000; display: none; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="video-contenedor">
    <video id="animacion-video" muted><source src="video.mp4" type="video/mp4"></video>
</div>

<div id="pantalla-registro">
    <div class="card-registro">
        <div class="logos-registro">
            <div class="logo-wrapper"><img src="logo1.png" alt="Alcaldía"></div>
            <div class="logo-wrapper"><img src="logo2.png" alt="Ecosocialismo"></div>
        </div>
        <h2>SIG Ecosocial - Simón Bolívar</h2>
        <p class="subtitle">Gestión de Riesgos y Vocería Comunal</p>

        <div class="tabs-acceso">
            <button class="tab-btn active" id="tab-registro" onclick="cambiarSeccion('registro')">Registro</button>
            <button class="tab-btn" id="tab-admin" onclick="cambiarSeccion('admin')">Admin</button>
        </div>

        <form id="form-registro-principal" class="form-registro" onsubmit="event.preventDefault(); registrarVocero();">
            <input type="email" id="regCor" placeholder="Correo Electrónico" required onblur="verificarUsuarioExistente()">
            <div id="campos-detalles" style="display:none; flex-direction:column; gap:10px;">
                <div class="form-row">
                    <input type="text" id="regNom" placeholder="Nombres" required>
                    <input type="text" id="regApe" placeholder="Apellidos" required>
                </div>
                <input type="text" id="regCed" placeholder="Cédula" required>
                <input type="text" id="regCom" placeholder="Comuna" required>
                <select id="selectVoceria">
                    <option value="Vocero de Ecosocialismo">Vocero de Ecosocialismo</option>
                    <option value="Otro">Otro</option>
                </select>
                <button type="submit" class="btn-acceder">Entrar al Sistema</button>
            </div>
            <button type="button" id="btn-verificar" class="btn-acceder" onclick="verificarUsuarioExistente()">Verificar Correo</button>
        </form>

        <form id="form-admin-acceso" class="form-admin" onsubmit="event.preventDefault(); validarAdmin();">
            <input type="email" id="adminEmail" placeholder="admin@bolivar.gob.ve" required>
            <input type="password" id="adminPass" placeholder="Contraseña" required>
            <button type="submit" class="btn-acceder">Acceso Administrativo</button>
        </form>
    </div>
</div>

<div id="sistema-principal">
    <div id="header">
        <img src="logo1.png" style="height:50px;">
        <h3 style="color:white; margin:0; font-size:16px;">MAPA DE RIESGOS COMUNITARIOS</h3>
        <button onclick="cerrarSesion()" style="background:none; border:1px solid var(--v-lime); color:white; cursor:pointer; padding:5px 10px; border-radius:5px;">Salir</button>
    </div>
    <div id="contenedor">
        <div id="sidebar">
            <h4 style="color:var(--v-lime); border-bottom:1px solid #444; padding-bottom:5px;">FACTORES DE RIESGO</h4>
            <button class="btn-mapa" onclick="setEmoji('🌊', 'inundación', this)">
                <span>🌊 Inundación</span> <span class="count-badge" id="c-inundación">0</span>
            </button>
            <button class="btn-mapa" onclick="setEmoji('🏚️', 'vivienda_riesgo', this)">
                <span>🏚️ Vivienda en Riesgo</span> <span class="count-badge" id="c-vivienda_riesgo">0</span>
            </button>
            <button class="btn-mapa" onclick="setEmoji('🗑️', 'basura', this)">
                <span>🗑️ Foco de Contaminación</span> <span class="count-badge" id="c-basura">0</span>
            </button>
            <button class="btn-mapa" onclick="setEmoji('🌳', 'area_verde', this)">
                <span>🌳 Área Verde</span> <span class="count-badge" id="c-area_verde">0</span>
            </button>
            <div style="margin-top:20px;">
                <button class="btn-acceder" onclick="guardarEnNube()">Sincronizar Datos</button>
            </div>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Configuración de Supabase (Basado en tus credenciales previas)
    const SUPABASE_URL = 'https://zezcmftcbbzplhtdqotd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bNaRcykfZaVdW67HsEf3Tw_rWemQCui';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map, markerGroup;
    let emojiSeleccionado = null;
    let tipoSeleccionado = null;
    let counts = { inundación: 0, vivienda_riesgo: 0, basura: 0, area_verde: 0 };

    // Navegación
    function cambiarSeccion(seccion) {
        document.getElementById('form-registro-principal').style.display = seccion === 'registro' ? 'grid' : 'none';
        document.getElementById('form-admin-acceso').style.display = seccion === 'admin' ? 'grid' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + seccion).classList.add('active');
    }

    // Lógica de Usuario
    async function verificarUsuarioExistente() {
        const correo = document.getElementById('regCor').value;
        if(!correo) return;

        const { data, error } = await _supabase.from('registross_voceros').select('*').eq('correo', correo).maybeSingle();
        
        document.getElementById('campos-detalles').style.display = 'flex';
        document.getElementById('btn-verificar').style.display = 'none';

        if(data) {
            document.getElementById('regNom').value = data.nombres;
            document.getElementById('regApe').value = data.apellidos;
            document.getElementById('regCed').value = data['cédula de identidad'];
            document.getElementById('regCom').value = data.comuna;
        }
    }

    async function registrarVocero() {
        const payload = {
            correo: document.getElementById('regCor').value,
            nombres: document.getElementById('regNom').value,
            apellidos: document.getElementById('regApe').value,
            'cédula de identidad': document.getElementById('regCed').value,
            comuna: document.getElementById('regCom').value,
            voceria: document.getElementById('selectVoceria').value
        };

        // Uso de upsert para evitar errores de duplicados y permitir actualizaciones
        const { error } = await _supabase.from('registross_voceros').upsert(payload, { onConflict: 'correo' });

        if(!error) {
            iniciarApp();
        } else {
            alert("Error: " + error.message);
        }
    }

    function iniciarApp() {
        document.getElementById('video-contenedor').style.display = 'flex';
        document.getElementById('animacion-video').play();
        
        document.getElementById('animacion-video').onended = () => {
            document.getElementById('video-contenedor').style.display = 'none';
            document.getElementById('pantalla-registro').style.display = 'none';
            document.getElementById('sistema-principal').style.display = 'flex';
            initMap();
        };
    }

    // Mapa
    function initMap() {
        map = L.map('map').setView([10.136, -64.686], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);
        markerGroup = L.layerGroup().addTo(map);

        map.on('click', (e) => {
            if(emojiSeleccionado) {
                addMarker(e.latlng, emojiSeleccionado, tipoSeleccionado);
            }
        });
    }

    function setEmoji(emoji, tipo, btn) {
        emojiSeleccionado = emoji;
        tipoSeleccionado = tipo;
        document.querySelectorAll('.btn-mapa').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addMarker(latlng, emoji, tipo) {
        const marker = L.marker(latlng, {
            icon: L.divIcon({
                html: `<div style="font-size:24px; background:white; border-radius:50%; padding:5px; box-shadow:0 2px 5px rgba(0,0,0,0.5)">${emoji}</div>`,
                className: 'custom-div-icon'
            })
        }).addTo(markerGroup);

        counts[tipo]++;
        document.getElementById('c-' + tipo).innerText = counts[tipo];
        
        marker.bindPopup(`<button onclick="removeMarker(this, '${tipo}')">Eliminar</button>`);
    }

    async function guardarEnNube() {
        const geojson = markerGroup.toGeoJSON();
        const user = document.getElementById('regCor').value;
        const comuna = document.getElementById('regCom').value;

        const { error } = await _supabase.from('mapas_comunales').upsert({
            user_id: user,
            id_comuna: comuna,
            geometria_mapa: geojson,
            usuario_email: user
        }, { onConflict: 'user_id' });

        if(!error) alert("✅ Datos sincronizados correctamente.");
    }

    function cerrarSesion() {
        location.reload();
    }
</script>
</body>
</html>
