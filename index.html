<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SIG Ecosocial - Municipio Simón Bolívar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Estilos base y variables de color */
        :root { 
            --v-lime: #B4D445; 
            --v-deep: #135242; 
            --negro-card: rgba(20, 22, 21, 0.98);
            --v-osc: #135242;
            --v-lim: #B4D445;
            --negro: #1a1c1b;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }

        /* Pantallas de Acceso */
        #pantalla-registro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--v-lime) 0%, var(--v-deep) 100%);
            z-index: 5000; display: flex; align-items: center; justify-content: center;
        }

        .card-registro {
            background: var(--negro-card); border: 2px solid var(--v-lime);
            width: 650px; padding: 40px; border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); text-align: center;
        }

        #video-contenedor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 6000; display: none;
            align-items: center; justify-content: center;
        }
        #animacion-video { width: 100%; height: 100%; object-fit: cover; }

        /* Componentes del Formulario */
        .logos-registro { display: flex; justify-content: space-between; margin-bottom: 20px; height: 110px; }
        .logo-wrapper { flex: 0 0 160px; height: 110px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .logos-registro img { width: 100%; height: 100%; object-fit: contain; transform: scale(2.0); }

        .tabs-acceso { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #666; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px; transition: 0.3s; padding: 5px 10px; }
        .tab-btn.active { color: var(--v-lime); border-bottom: 2px solid var(--v-lime); }

        .form-registro, .form-admin { text-align: left; display: grid; gap: 15px; }
        .form-admin { display: none; }
        label { font-size: 11px; color: var(--v-lime); text-transform: uppercase; font-weight: 800; margin-bottom: 5px; display: block; }
        input, select { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; outline: none; }

        .btn-acceder { background: var(--v-lime); color: var(--v-deep); border: none; padding: 16px; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; }

        /* Estructura del Sistema Principal */
        #sistema-principal { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #111; color: white; }
        #header { height: 130px; background: var(--v-osc); border-bottom: 5px solid var(--v-lim); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; position: relative;}
        #contenedor { display: flex; flex-grow: 1; overflow: hidden; }

        /* Paneles Laterales */
        #sidebar, #panel-admin-comunas { width: 440px; background: var(--negro); color: white; padding: 15px; overflow-y: auto; border-right: 2px solid #333; }
        #panel-admin-comunas { display: none; }

        .item-comuna-admin { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .badge-mapas { background: var(--v-lim); color: var(--v-osc); padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 900; }

        /* Mapa y Controles */
        #map-container { flex-grow: 1; position: relative; background: #1a1a1a; }
        #map { width: 100%; height: 100%; }
        .controles-mapa-horiz { position: absolute; top: 15px; left: 60px; z-index: 2000; display: flex; gap: 8px; }
        .btn-float { width: 42px; height: 42px; background: white; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-float.activo-float { background: var(--v-lim); }

        /* Elementos del Inventario */
        .btn-mapa { width: 100%; padding: 8px; margin: 2px 0; background: #252827; color: white; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 10.5px; display: flex; justify-content: space-between; align-items: center; }
        .count-badge { background: #333; color: var(--v-lim); padding: 2px 6px; border-radius: 10px; font-size: 10px; }
        .btn-mapa.active { background: var(--v-osc); border-color: var(--v-lim); }

        .user-location-icon { background: #4285F4; width: 14px; height: 14px; border-radius: 50%; border: 3px solid white; }
    </style>
</head>
<body>

<!-- Pantalla de Carga/Video -->
<div id="video-contenedor">
    <video id="animacion-video" muted><source src="video.mp4" type="video/mp4"></video>
</div>

<!-- Pantalla de Inicio y Registro -->
<div id="pantalla-registro">
    <div class="card-registro">
        <div class="logos-registro">
            <div class="logo-wrapper"><img src="logo1.png.png"></div>
            <div class="logo-wrapper"><img src="logo2.png.png"></div>
        </div>
        <h2>SISTEMA DE GESTIÓN</h2>
        <p style="color: var(--v-lime); font-size: 13px; font-weight: bold;">Municipio Simón Bolívar</p>

        <div class="tabs-acceso">
            <button class="tab-btn active" onclick="cambiarSeccion('registro')">Registro Vocero</button>
            <button class="tab-btn" onclick="cambiarSeccion('admin')">Administrador</button>
        </div>

        <form id="form-registro-principal" class="form-registro" onsubmit="event.preventDefault(); registrarVocero();">
            <input type="email" id="regCor" placeholder="Correo Electrónico" required onblur="verificarCorreo()">
            <div id="campos-dinamicos-registro" style="display:none; flex-direction: column; gap: 10px;">
                <input type="text" id="regNom" placeholder="Nombres" required>
                <input type="text" id="regCed" placeholder="Cédula" required>
                <input type="text" id="regCom" placeholder="Comuna" required>
                <button type="submit" class="btn-acceder">ENTRAR AL SISTEMA</button>
            </div>
        </form>

        <form id="form-admin-acceso" class="form-admin" onsubmit="event.preventDefault(); validarAdmin();">
            <input type="email" id="adminEmail" placeholder="admin@bolivar.gob.ve" required>
            <input type="password" id="adminPass" placeholder="Contraseña" required>
            <button type="submit" class="btn-acceder">INICIAR SESIÓN ADMIN</button>
        </form>
    </div>
</div>

<!-- Sistema Principal -->
<div id="sistema-principal">
    <div id="header">
        <div id="titulo-principal">MAPA DE RIESGOS COMUNITARIOS</div>
        <div style="color: var(--v-lime); font-size: 12px;">Gestión de Ecosocialismo - Barcelona</div>
    </div>

    <div id="contenedor">
        <!-- Panel de Administrador (Lista de Comunas) -->
        <div id="panel-admin-comunas">
            <h4 style="color: var(--v-lim);">🛡️ PANEL ADMINISTRATIVO</h4>
            <div id="lista-comunas-admin"></div>
            <button class="btn-acceder" style="background:#e74c3c; color:white; margin-top:20px;" onclick="confirmarSalidaSegura()">SALIR DEL SISTEMA</button>
        </div>

        <!-- Barra Lateral de Inventario -->
        <div id="sidebar">
            <button id="btnVolverAdmin" class="btn-acceder" style="display:none; padding:10px; margin-bottom:10px; background:#444;" onclick="volverAlPanelControl()">⬅️ VOLVER AL PANEL</button>
            
            <select id="selectComuna" class="btn-mapa" style="background:#111;">
                <option value="">-- SELECCIONE COMUNA --</option>
                <option value="4F-92">4F-92 COMANDANTE ETERNO</option>
                <option value="CACIQUE GUAICAIPURO">CACIQUE GUAICAIPURO</option>
                <option value="BERGANTIN">AGROECOLOGICA BERGANTIN</option>
                <!-- Agregar todas las comunas aquí -->
            </select>

            <h4 style="color: var(--v-lim);">🚩 VULNERABILIDAD</h4>
            <button class="btn-mapa" onclick="cambiarEmoji('🤰',this,'vuln_emb')">Mujer Embarazada <span class="count-badge" id="count-vuln_emb">0</span></button>
            <button class="btn-mapa" onclick="cambiarEmoji('⚠️',this,'riesgo')">Zona de Riesgo <span class="count-badge" id="count-riesgo">0</span></button>
            
            <h4 style="color: var(--v-lim);">🌳 GESTIÓN FORESTAL</h4>
            <button class="btn-mapa" onclick="cambiarEmoji('🌳',this,'verde')">Área Verde <span class="count-badge" id="count-verde">0</span></button>

            <button class="btn-acceder" style="background:#e74c3c; color:white; margin-top:30px;" onclick="confirmarSalidaSegura()">💾 GUARDAR Y SALIR</button>
        </div>

        <!-- Área de Mapa -->
        <div id="map-container">
            <div class="controles-mapa-horiz">
                <button id="floatMano" class="btn-float activo-float" onclick="activarMano()">🖐️</button>
                <button class="btn-float" onclick="irAMiUbicacion()">🎯</button>
            </div>
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://npmcdn.com/leaflet-editable@1.2.0/src/Leaflet.Editable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Configuración de Supabase
    const _supabase = supabase.createClient('https://zezcmftcbbzplhtdqotd.supabase.co', 'sb_publishable_bNaRcykfZaVdW67HsEf3Tw_rWemQCui');

    let map, emojiActual = null, modoEspecial = "", modoNavegar = true;
    let stackElementos = [], rolActual = "usuario";
    let contadores = { vuln_emb: 0, riesgo: 0, verde: 0 };
    let dbMapasCount = {};

    const listaComunas = ["4F-92", "CACIQUE GUAICAIPURO", "BERGANTIN"]; // Lista completa

    // Funciones de Sesión
    function cambiarSeccion(tipo) {
        document.getElementById('form-registro-principal').style.display = (tipo === 'registro' ? 'grid' : 'none');
        document.getElementById('form-admin-acceso').style.display = (tipo === 'admin' ? 'grid' : 'none');
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tipo==='registro' && i===0) || (tipo==='admin' && i===1)));
    }

    function validarAdmin() {
        const u = document.getElementById('adminEmail').value;
        const p = document.getElementById('adminPass').value;
        if (u === "yetzonmora@gmail.com" && p === "32568263") {
            rolActual = "admin";
            reproducirAnimacion();
        } else { alert("Credenciales inválidas"); }
    }

    function reproducirAnimacion() {
        const v = document.getElementById('animacion-video');
        document.getElementById('video-contenedor').style.display = 'flex';
        v.play();
        v.onended = () => {
            document.getElementById('video-contenedor').style.display = 'none';
            document.getElementById('pantalla-registro').style.display = 'none';
            document.getElementById('sistema-principal').style.display = 'flex';
            inicializarMapa();
            if(rolActual === 'admin') mostrarPanelAdmin();
        };
    }

    // Funciones del Panel Administrativo
    function mostrarPanelAdmin() {
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('panel-admin-comunas').style.display = 'block';
        const lista = document.getElementById('lista-comunas-admin');
        lista.innerHTML = "";
        listaComunas.forEach(c => {
            const div = document.createElement('div');
            div.className = 'item-comuna-admin';
            div.innerHTML = `<span>${c}</span> <span class="badge-mapas">0</span>`;
            div.onclick = () => {
                document.getElementById('panel-admin-comunas').style.display = 'none';
                document.getElementById('sidebar').style.display = 'block';
                document.getElementById('btnVolverAdmin').style.display = 'block';
                document.getElementById('selectComuna').value = c;
            };
            lista.appendChild(div);
        });
    }

    function volverAlPanelControl() {
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('panel-admin-comunas').style.display = 'block';
        document.getElementById('btnVolverAdmin').style.display = 'none';
    }

    // Funciones de Mapa
    function inicializarMapa() {
        if (map) return;
        map = L.map('map', { editable: true }).setView([10.136, -64.686], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);
        map.on('click', e => { if (emojiActual && !modoNavegar) crearIcono(e.latlng); });
    }

    function crearIcono(latlng) {
        const m = L.marker(latlng, {
            icon: L.divIcon({ html: `<div style="font-size:20px;">${emojiActual}</div>`, className: '' }),
            draggable: true
        }).addTo(map);
        m.tipoId = modoEspecial;
        contadores[modoEspecial]++;
        actualizarBadges();
        stackElementos.push(m);
    }

    function activarMano() { 
        emojiActual = null; modoNavegar = true; 
        document.getElementById('floatMano').classList.add('activo-float');
    }

    function cambiarEmoji(e, btn, esp) {
        emojiActual = e; modoEspecial = esp; modoNavegar = false;
        document.getElementById('floatMano').classList.remove('activo-float');
    }

    function actualizarBadges() {
        for (let k in contadores) {
            const el = document.getElementById('count-' + k);
            if (el) el.innerText = contadores[k];
        }
    }

    async function confirmarSalidaSegura() {
        const com = document.getElementById('selectComuna').value;
        if (!com) { alert("Seleccione una Comuna para guardar."); return; }

        if (confirm(`¿Guardar cambios en ${com} y salir?`)) {
            const geojson = L.featureGroup(stackElementos).toGeoJSON();
            const { error } = await _supabase.from('mapas_comunales').insert([{
                id_comuna: com,
                geometria_mapa: geojson,
                usuario_email: localStorage.getItem('user_email_active')
            }]);

            if (error) alert("Error al guardar: " + error.message);
            else window.location.reload();
        }
    }

    function irAMiUbicacion() {
        navigator.geolocation.getCurrentPosition(p => {
            const ll = [p.coords.latitude, p.coords.longitude];
            map.setView(ll, 18);
            L.marker(ll, { icon: L.divIcon({ className:'user-location-icon' }) }).addTo(map);
        });
    }
</script>
</body>
</html>
