<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Riesgos y Reciclaje - Comunitario</title>
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #2e7d32;
            --danger: #d32f2f;
            --accent: #fbc02d;
            --white: #ffffff;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }

        /* Panel de Leyenda Principal */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 250px;
        }

        /* Segunda Leyenda (Formulario de Reciclaje) */
        #recycling-form-panel {
            position: absolute;
            top: 10px;
            right: -400px; /* Oculto por defecto */
            z-index: 1001;
            background: var(--white);
            width: 350px;
            height: 95vh;
            overflow-y: auto;
            transition: right 0.4s ease;
            padding: 20px;
            border-radius: 15px 0 0 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
        }

        #recycling-form-panel.active { right: 0; }

        .form-section { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .form-section h3 { font-size: 0.9rem; color: var(--primary); text-transform: uppercase; }

        label { display: block; font-size: 0.8rem; font-weight: bold; margin-top: 8px; }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-close {
            background: #eee;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            float: right;
            cursor: pointer;
        }

        .icon-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leyenda de Riesgos (Lado Izquierdo) -->
    <div id="legend">
        <h4 style="margin-top:0">Riesgos Ambientales</h4>
        <div class="legend-item">🛑 Inundación</div>
        <div class="legend-item">⚠️ Vertedero de Basura</div>
        <div class="legend-item">☣️ Aguas Servidas</div>
        <div class="legend-item">🔥 Quema de Desechos</div>
        <div class="legend-item">🦟 Foco de Vectores</div>
        <hr>
        <div class="legend-item">♻️ <strong>Punto de Reciclaje</strong></div>
        <p style="font-size: 0.7rem; color: #666;">Toca un icono de reciclaje para registrar datos.</p>
    </div>

    <!-- Segunda Leyenda: Formulario de Reciclaje (Lado Derecho) -->
    <div id="recycling-form-panel" id="recyclingForm">
        <button class="btn-close" onclick="closeForm()">✖</button>
        <h2 style="color: var(--primary); font-size: 1.2rem;">Registro de Recicladores</h2>
        
        <form id="formReciclaje">
            <!-- SECCIÓN 1: DATOS GEOGRÁFICOS -->
            <div class="form-section">
                <h3>📍 Datos Geográficos</h3>
                <label>Estado / Municipio</label>
                <input type="text" placeholder="Ej: Anzoátegui / Simón Bolívar">
                <label>Parroquia / Comuna</label>
                <input type="text" placeholder="Nombre de la comuna">
                <label>Consejo Comunal / Sector</label>
                <input type="text" placeholder="Sector específico">
                <label>Coordenadas (Lat, Lng)</label>
                <input type="text" id="coords" readonly style="background: #f9f9f9;">
            </div>

            <!-- SECCIÓN 2: DATOS DE USUARIO -->
            <div class="form-section">
                <h3>👤 Datos de Usuario</h3>
                <label>Encargado o Propietario</label>
                <input type="text" placeholder="Nombre completo">
                <label>Cédula</label>
                <input type="text" placeholder="V-00.000.000">
                <label>Correo / Teléfono</label>
                <input type="email" placeholder="email@ejemplo.com">
                <input type="tel" placeholder="04XX-0000000" style="margin-top:5px">
                <label>Sexo</label>
                <select>
                    <option>Femenino</option>
                    <option>Masculino</option>
                    <option>Otro</option>
                </select>
            </div>

            <!-- SECCIÓN 3: EMPRESA O EMPRENDIMIENTO -->
            <div class="form-section">
                <h3>🏢 Datos de la Entidad</h3>
                <label>Razón Social</label>
                <select>
                    <option>Empresa</option>
                    <option>Emprendimiento Popular</option>
                </select>
                <label>Tipo de Propiedad</label>
                <select>
                    <option>Privada</option>
                    <option>Pública</option>
                </select>
                <label>RIF</label>
                <input type="text" placeholder="J-00000000-0">
                <label>¿Registrado en SABAT / RACDA?</label>
                <div style="font-size: 0.8rem; margin-top: 5px;">
                    <input type="checkbox" style="width: auto;"> SABAT 
                    <input type="checkbox" style="width: auto; margin-left: 10px;"> RACDA
                </div>
                <label>Material Mensual (Aprox)</label>
                <input type="text" placeholder="Ej: 500kg / 2 Ton">
                <label>Disposición Final</label>
                <textarea rows="2" placeholder="¿A dónde va el material?"></textarea>
                <label>Fotos (Evidencia)</label>
                <input type="file" accept="image/*" multiple>
            </div>

            <button type="button" class="btn-save" onclick="saveData()">GUARDAR REGISTRO</button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Aquí iría tu configuración de mapa ya existente
        // Para que el formulario aparezca:
        function openRecyclingForm(latlng) {
            document.getElementById('recycling-form-panel').classList.add('active');
            document.getElementById('coords').value = latlng.lat.toFixed(6) + ", " + latlng.lng.toFixed(6);
        }

        function closeForm() {
            document.getElementById('recycling-form-panel').classList.remove('active');
        }

        function saveData() {
            // Aquí conectarás con Supabase
            alert("Datos preparados para enviar a Supabase");
            closeForm();
        }
    </script>
</body>
</html>
