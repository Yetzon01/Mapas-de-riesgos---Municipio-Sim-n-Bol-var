;"></p>
</div>

<div id="map"></div>

<!-- Scripts Externos -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Configuración de Supabase
    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. Inicialización del Mapa (Centrado en Barcelona, Anzoátegui)
    const map = L.map('map').setView([10.1333, -64.7000], 13);
    
    const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains:['mt0','mt1','mt2','mt3']
    }).addTo(map);

    // 3. Persistencia con Local Storage
    const form = document.getElementById('ecoForm');
    
    // Auto-guardado en LocalStorage mientras el usuario escribe
    form.addEventListener('input', () => {
        const tempData = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            comuna: document.getElementById('comuna').value
        };
        localStorage.setItem('temp_registro', JSON.stringify(tempData));
    });

    // Recuperar datos al recargar
    window.onload = () => {
        const saved = localStorage.getItem('temp_registro');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('nombre').value = data.nombre || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('comuna').value = data.comuna || '';
        }
    };

    // 4. Herramientas de Dibujo (Polígonos de Riesgo)
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
        draw: {
            polygon: true,
            polyline: true,
            circle: false,
            marker: true,
            rectangle: false
        },
        edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (event) {
        const layer = event.layer;
        drawnItems.addLayer(layer);
        document.getElementById('geo_data').value = JSON.stringify(layer.toGeoJSON());
    });

    // 5. Envío de Datos a Supabase
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        const msg = document.getElementById('statusMsg');
        
        btn.disabled = true;
        msg.innerText = "Sincronizando con Supabase...";

        const payload = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            comuna: document.getElementById('comuna').value,
            geometria: document.getElementById('geo_data').value,
            fecha_registro: new Date().toISOString()
        };

        const { data, error } = await supabase
            .from('registross_voceros')
            .insert([payload]);

        if (error) {
            msg.style.color = "red";
            msg.innerText = "Error: " + error.message;
            console.error(error);
        } else {
            msg.style.color = var(--v-lime);
            msg.innerText = "¡Registro exitoso en Barcelona!";
            localStorage.removeItem('temp_registro'); // Limpiar al éxito
            form.reset();
            drawnItems.clearLayers();
        }
        btn.disabled = false;
    });

    // 6. Geolocalización en Tiempo Real
    map.locate({setView: true, maxZoom: 16, watch: true});
    
    let locationMarker;
    map.on('locationfound', (e) => {
        const radius = e.accuracy / 2;
        if (!locationMarker) {
            locationMarker = L.marker(e.latlng, {
                icon: L.divIcon({className: 'user-location-dot'})
            }).addTo(map);
        } else {
            locationMarker.setLatLng(e.latlng);
        }
    });
</script>

</body>
</html>
